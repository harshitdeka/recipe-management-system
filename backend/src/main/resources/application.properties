# ── Database Configuration ─────────────────────────────────────────────────────
# Replace 'root' and 'yourpassword' with your actual MySQL credentials
spring.datasource.url=jdbc:mysql://localhost:3306/recipedb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
# 'update' = auto-creates/updates tables on startup (good for development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT Configuration ──────────────────────────────────────────────────────────
# IMPORTANT: Change this secret to a long random string before deploying!
jwt.secret=RecipeManagementSystemSuperSecretKeyThatShouldBeVeryLongAndRandomForSecurity2024
jwt.expiration=86400000

# ── Server ─────────────────────────────────────────────────────────────────────
server.port=8080
